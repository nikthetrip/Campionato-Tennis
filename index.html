<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Club 6 Amici</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans pb-12">

    <div class="max-w-4xl mx-auto p-4">
        <header class="text-center my-6">
            <h1 class="text-3xl font-extrabold text-emerald-400">🎾 Campionato Tennis 6 Amici</h1>
            <p class="text-slate-400 text-sm mt-1">Gestione Tornei e Classifiche Live</p>
        </header>

        <!-- Contenitore Principale dell'App -->
        <div id="app" class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
            <div class="mb-4 flex gap-2 border-b border-slate-700 pb-3 overflow-x-auto">
                <button onclick="switchTab('classifica')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold transition">Classifica</button>
                <button onclick="switchTab('calendario')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Calendario</button>
                <button onclick="switchTab('tornei')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Tornei</button>
            </div>

            <!-- Sezione Classifica -->
            <div id="tab-classifica" class="tab-content">
                <h2 class="text-xl font-bold mb-4 text-emerald-300">Classifica Generale</h2>
                <div id="classifica-container">
                    <!-- Tabella dinamica generata da JS -->
                </div>
            </div>

            <!-- Sezione Calendario / Inserimento Risultati -->
            <div id="tab-calendario" class="tab-content hidden">
                <h2 class="text-xl font-bold mb-4 text-emerald-300">Calendario e Risultati</h2>
                <div id="calendario-container" class="space-y-3">
                    <!-- Esempio di riga partita con pulsante di salvataggio test -->
                    <div class="bg-slate-700/50 p-4 rounded-xl flex justify-between items-center border border-slate-600">
                        <div>
                            <span class="font-bold text-white">Marco</span> vs <span class="font-bold text-white">Luca</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" id="s1_test" value="6" class="w-12 bg-slate-800 text-center rounded border border-slate-600 py-1">
                            <span>-</span>
                            <input type="number" id="s2_test" value="4" class="w-12 bg-slate-800 text-center rounded border border-slate-600 py-1">
                            <button onclick="registraRisultatoTest()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded font-bold text-sm transition">✔</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sezione Tornei -->
            <div id="tab-tornei" class="tab-content hidden">
                <h2 class="text-xl font-bold mb-4 text-emerald-300">Tornei Speciali (Pisarei, Salame, Mariola, Pancetta)</h2>
                <p class="text-slate-400 text-sm">Tabelloni in corso...</p>
            </div>
        </div>
    </div>

    <script>
        // Stato di default dell'applicazione
        let state = window.serverState || {
            currentSeason: 1,
            players: ["Marco", "Luca", "Andrea", "Matteo", "Stefano", "Davide"],
            matches: [
                { id: 1, p1: "Marco", p2: "Luca", s1: 6, s2: 3 }
            ],
            tournaments: {},
            alboDoro: []
        };

        // Funzione fondamentale per sincronizzare automaticamente i dati su GitHub in background
        async function saveToGitHub(newState) {
            if (!window.githubConfig || !window.githubConfig.token) {
                console.warn("Configurazione GitHub non trovata nel browser.");
                return;
            }
            const { token, repo, path } = window.githubConfig;
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            
            try {
                // 1. Recupera lo SHA aggiornato del file su GitHub
                const getRes = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const fileData = await getRes.json();
                const sha = fileData.sha;

                // 2. Codifica il nuovo stato in Base64
                const contentStr = JSON.stringify(newState, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(contentStr)));

                // 3. Invia il file aggiornato a GitHub
                await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Aggiornamento risultati da app",
                        content: base64Content,
                        sha: sha
                    })
                });
                console.log("Sincronizzato con GitHub con successo!");
            } catch (err) {
                console.error("Errore durante la sincronizzazione con GitHub:", err);
            }
        }

        // Gestione dei Tab
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');
        }

        // Funzione di test per registrare un risultato e salvare su GitHub
        function registraRisultatoTest() {
            const s1 = document.getElementById('s1_test').value;
            const s2 = document.getElementById('s2_test').value;
            
            // Aggiorna lo stato locale
            state.matches.push({ id: Date.now(), p1: "Marco", p2: "Luca", s1: parseInt(s1), s2: parseInt(s2) });
            
            // Salva nel browser
            localStorage.setItem('tennis_app_state', JSON.stringify(state));

            // Salva automaticamente su GitHub in background per tutti gli amici!
            saveToGitHub(state);

            alert("Risultato salvato e sincronizzato con successo su GitHub!");
            renderClassifica();
        }

        function renderClassifica() {
            const container = document.getElementById('classifica-container');
            container.innerHTML = `<div class="p-3 bg-slate-700/30 rounded-lg">Partite registrate totali: ${state.matches.length}</div>`;
        }

        // Avvio iniziale
        renderClassifica();
    </script>
</body>
</html>
