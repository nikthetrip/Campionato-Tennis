<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campionato Tennis 6 Amici</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-10">

    <div class="max-w-4xl mx-auto p-4">
        <!-- Intestazione -->
        <header class="text-center my-6">
            <h1 class="text-3xl font-extrabold text-emerald-400">🎾 Campionato Tennis 6 Amici</h1>
            <p class="text-slate-400 text-sm mt-1">Gestione Round-Robin, Calendario e Tornei</p>
        </header>

        <!-- Menu a Schede (Tabs) -->
        <div class="flex gap-2 border-b border-slate-700 pb-3 mb-6 overflow-x-auto">
            <button onclick="switchTab('classifica')" id="btn-classifica" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold transition shadow">Classifica</button>
            <button onclick="switchTab('calendario')" id="btn-calendario" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-semibold transition">Calendario</button>
            <button onclick="switchTab('tornei')" id="btn-tornei" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-semibold transition">Tornei</button>
        </div>

        <!-- SEZIONE 1: CLASSIFICA -->
        <div id="tab-classifica" class="tab-content space-y-4">
            <h2 class="text-xl font-bold text-emerald-300">Classifica Generale</h2>
            <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-lg overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-sm">
                            <th class="p-3">Pos</th>
                            <th class="p-3">Giocatore</th>
                            <th class="p-3 text-center">Pt</th>
                            <th class="p-3 text-center">G</th>
                            <th class="p-3 text-center">V</th>
                            <th class="p-3 text-center">P</th>
                            <th class="p-3 text-center">Set</th>
                        </tr>
                    </thead>
                    <tbody id="table-classifica-body">
                        <!-- Popolato dinamicamente da JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SEZIONE 2: CALENDARIO E RISULTATI -->
        <div id="tab-calendario" class="tab-content hidden space-y-4">
            <h2 class="text-xl font-bold text-emerald-300">Calendario Partite</h2>
            <div id="calendario-container" class="space-y-3">
                <!-- Popolato dinamicamente da JS -->
            </div>
        </div>

        <!-- SEZIONE 3: TORNEI SPECIALI -->
        <div id="tab-tornei" class="tab-content hidden space-y-4">
            <h2 class="text-xl font-bold text-emerald-300">Tornei Speciali</h2>
            <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-lg">
                <p class="text-slate-400 text-sm">Gestione dei 4 tornei specifici in corso...</p>
            </div>
        </div>
    </div>

    <!-- Script Logica App & GitHub Sync -->
    <script>
        // Inizializzazione dello stato (legge da serverState iniettato da Python o localStorage)
        let state = window.serverState || JSON.parse(localStorage.getItem('tennis_app_state')) || {
            players: ["Marco", "Luca", "Andrea", "Matteo", "Stefano", "Davide"],
            matches: [
                { id: 1, p1: "Marco", p2: "Luca", s1: null, s2: null, played: false },
                { id: 2, p1: "Andrea", p2: "Matteo", s1: null, s2: null, played: false },
                { id: 3, p1: "Stefano", p2: "Davide", s1: null, s2: null, played: false }
            ]
        };

        // Funzione per sincronizzare automaticamente i dati su GitHub in background
        async function saveToGitHub(newState) {
            if (!window.githubConfig || !window.githubConfig.token) {
                console.warn("Configurazione GitHub assente, salvataggio solo locale.");
                return;
            }
            const { token, repo, path } = window.githubConfig;
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            
            try {
                const getRes = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const fileData = await getRes.json();
                const sha = fileData.sha;

                const contentStr = JSON.stringify(newState, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(contentStr)));

                await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Aggiornamento risultati da app",
                        content: base64Content,
                        sha: sha
                    })
                });
                console.log("Sincronizzato con GitHub con successo!");
            } catch (err) {
                console.error("Errore durante la sincronizzazione con GitHub:", err);
            }
        }

        // Gestione cambio tab
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('button[id^="btn-"]').forEach(el => {
                el.classList.remove('bg-emerald-600', 'text-white', 'shadow');
                el.classList.add('bg-slate-800', 'text-slate-300');
            });

            document.getElementById('tab-' + tabName).classList.remove('hidden');
            const activeBtn = document.getElementById('btn-' + tabName);
            activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
            activeBtn.classList.add('bg-emerald-600', 'text-white', 'shadow');
        }

        // Render della Classifica
        function renderClassifica() {
            const tbody = document.getElementById('table-classifica-body');
            tbody.innerHTML = "";

            // Calcolo semplice dei punti basato sui match giocati
            let stats = {};
            state.players.forEach(p => {
                stats[p] = { played: won: 0, lost: 0, pts: 0, setsFor: 0, setsAg: 0 };
            });

            // Esempio di elaborazione match
            state.matches.forEach(m => {
                if (m.played && m.s1 !== null && m.s2 !== null) {
                    // Logica punti base
                }
            });

            // Mostra i giocatori in tabella
            state.players.forEach((p, index) => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition">
                        <td class="p-3 font-bold text-emerald-400">#${index + 1}</td>
                        <td class="p-3 font-semibold text-white">${p}</td>
                        <td class="p-3 text-center font-bold text-emerald-300">0</td>
                        <td class="p-3 text-center text-slate-300">0</td>
                        <td class="p-3 text-center text-emerald-400">0</td>
                        <td class="p-3 text-center text-rose-400">0</td>
                        <td class="p-3 text-center text-slate-300">0-0</td>
                    </tr>
                `;
            });
        }

        // Render del Calendario
        function renderCalendario() {
            const container = document.getElementById('calendario-container');
            container.innerHTML = "";

            state.matches.forEach((m) => {
                container.innerHTML += `
                    <div class="bg-slate-800 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-center border border-slate-700 gap-3 shadow">
                        <div class="font-medium text-white">
                            <span class="text-emerald-400 font-bold">${m.p1}</span> vs <span class="text-emerald-400 font-bold">${m.p2}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" id="s1_${m.id}" value="${m.s1 !== null ? m.s1 : ''}" placeholder="0" class="w-14 bg-slate-900 text-center rounded border border-slate-600 py-1 text-white">
                            <span>-</span>
                            <input type="number" id="s2_${m.id}" value="${m.s2 !== null ? m.s2 : ''}" placeholder="0" class="w-14 bg-slate-900 text-center rounded border border-slate-600 py-1 text-white">
                            <button onclick="salvaPartita(${m.id})" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded font-bold text-sm transition shadow">✔</button>
                        </div>
                    </div>
                `;
            });
        }

        // Funzione per salvare il risultato di una partita
        function salvaPartita(matchId) {
            const s1Val = parseInt(document.getElementById(`s1_${matchId}`).value);
            const s2Val = parseInt(document.getElementById(`s2_${matchId}`).value);

            if (isNaN(s1Val) || isNaN(s2Val)) {
                alert("Inserisci punteggi validi!");
                return;
            }

            const match = state.matches.find(m => m.id === matchId);
            if (match) {
                match.s1 = s1Val;
                match.s2 = s2Val;
                match.played = true;

                // Salva in locale nel browser
                localStorage.setItem('tennis_app_state', JSON.stringify(state));

                // Sincronizza automaticamente su GitHub in background per tutti gli utenti!
                saveToGitHub(state);

                alert("Risultato salvato e sincronizzato con successo!");
                renderClassifica();
                renderCalendario();
            }
        }

        // Avvio iniziale dell'interfaccia
        renderClassifica();
        renderCalendario();
    </script>
</body>
</html>
